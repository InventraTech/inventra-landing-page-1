<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../.style_log_entrar.css">
    <link rel="icon" href="utils/logo_inventra_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div id="login">
        <header>    
            <a href="#" id="img_voltar"></a>
            <img src="utils/logo_inventra_icon.png" width="65">
            <h1 id="title">Comece com o <spam id="roxo">Inventra</spam></h1> 
            <p id="descricao_head">Crie sua conta gratuita ou entre para continuar.</p>          
        </header>
        <button class="botoes_entrar_conta">
            <img src="utils/google_icon.svg">
            <p>Continuar com Google</p>

        </button>
        <button class="botoes_entrar_conta">
            <img src="utils/Microsoft_icon.svg">
            <p>Continuar com Microsoft</p>

        </button>
        <div id="separador">
            <div class="linha"></div>
            <span>ou com E-mail</span>
            <div class="linha"></div>
        </div>
        <div id="trocar_de_log">
            <button  id="criar_cont" class="botao_padrao">
                <a href="http://127.0.0.1:5500/Inventra1-HTML/login_criar_cont.html?nome=ewr&email=asdfghj%40dsfghj&senha=12334">Criar conta</a>
            </button>
            <button  id="entra_cont" class="botao_padrao">
                <p>Entrar</p>
            </button>
        </div>
        <form>
            <label for="email">E-mail</label><br>
            <input  name="email" type="email" placeholder="voce@empresa.com" required><br>
            <label for="senha">Senha</label><br>
            <input  name="senha" type="password" placeholder="Digite sua senha" required>

            <button id="entrar_site" type="submit">
                <p>Criar conta grátis</p>
            </button>
        </form>
        
        <footer>
            <p>Ao criar uma conta você concorda com nossos Termos e<br> Política de Privacidade.</p>
        </footer>

    </div>
</body>
